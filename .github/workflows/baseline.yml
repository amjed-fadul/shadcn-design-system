name: Baseline verification

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/popover-declaration-probe.test.ts
      - run: |
          git checkout -B feat/release-5-popover origin/feat/release-5-popover
          npx vitest run tests/popover-interface-generator.test.ts
          if ! git diff --quiet -- contracts/components/interfaces; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts/components/interfaces
            git commit -m "feat: add generated popover interface contracts"
            git push origin HEAD:feat/release-5-popover
          fi
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

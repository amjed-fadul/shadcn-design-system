name: Release qualification
run-name: Release qualification · ${{ inputs.pr_head_sha }}

on:
  workflow_dispatch:
    inputs:
      pr_head_sha:
        description: Exact 40-character PR head commit SHA to qualify before merge
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    # The frozen R4 producer's input guard requires macOS.
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
    steps:
      - name: Require an immutable revision
        run: '[[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha }}
          fetch-depth: 0
      - name: Confirm qualified checkout
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - name: Provision retained release artifacts
        run: |
          directory="$RUNNER_TEMP/release-artifacts"
          mkdir -p "$directory"
          git fetch --no-tags --depth=1 origin ci/release-artifacts
          git archive FETCH_HEAD | tar -x -C "$directory"
          (cd "$directory" && shasum -a 256 --check SHA256SUMS)
          echo "ADC_R3_ARTIFACT_DIRECTORY=$directory/shadcn-radix-release-003" >> "$GITHUB_ENV"
          echo "ADC_R4_ARTIFACT_DIRECTORY=$directory/shadcn-radix-release-004" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test-storybook
      - run: npm run build-storybook
      - run: npm audit --omit=dev
      - run: npm audit
      - name: Verify committed release and byte-identical candidate rebuild
        run: |
          manifest="$PWD/provenance/distributions/shadcn-radix-release-013.distribution.json"
          manifest_sha256="$(shasum -a 256 "$manifest" | cut -d ' ' -f 1)"
          payload_sha256="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).release.payloadSha256" "$manifest")"
          candidate="$RUNNER_TEMP/qualified-r13-candidate"
          npm run release:verify -- --release-sha256 "$payload_sha256"
          npm run candidate:generate -- --output "$candidate"
          npm run candidate:verify -- --manifest "$manifest" --tarball "$candidate/adc-shadcn-design-system-0.0.0-release.13.tgz" --manifest-sha256 "$manifest_sha256"
          git diff --exit-code
          printf 'Qualified PR head: `%s`\n\nRelease payload: `%s`\n\nDistribution manifest: `%s`\n' "$PR_HEAD_SHA" "$payload_sha256" "$manifest_sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-qualification-${{ inputs.pr_head_sha }}
          path: ${{ runner.temp }}/qualified-r13-candidate
          if-no-files-found: error

name: Drawer interface generation

on:
  push:
    branches:
      - feat/release-5-drawer

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/drawer-interface-generator.test.ts --testTimeout=60000
      - name: Commit generated interfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/components/interfaces/vaul.drawer.*.json
          git diff --cached --quiet || git commit -m "feat: add generated drawer interface contracts"
          git push origin HEAD:feat/release-5-drawer

name: Command dependency generation

on:
  push:
    branches:
      - feat/release-5-command

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: npm install cmdk@1.1.1 --save-exact --package-lock-only --ignore-scripts
      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "build: add command cmdk dependency"
          git push origin HEAD:feat/release-5-command

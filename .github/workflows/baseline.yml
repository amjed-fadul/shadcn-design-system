name: Baseline verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm audit --omit=dev
      - name: Full dependency audit
        if: ${{ hashFiles('provenance/releases/shadcn-radix-release-009.json') != '' }}
        run: npm audit
      - name: Fast release identity, contract and preservation checks
        shell: bash
        run: |
          tests=(
            tests/component-contract-schema.test.ts
            tests/token-contract-schema.test.ts
            tests/token-contract-index.test.ts
            tests/release-5-workflows.test.ts
          )
          for optional in             tests/canonical-release-r14-binding.test.ts             tests/release009-preservation.test.ts             tests/historical-artifacts.test.ts
          do
            [[ -f "$optional" ]] && tests+=("$optional")
          done
          npm run test -- "${tests[@]}"

name: Popover contract analysis

on:
  push:
    branches:
      - feat/release-5-popover

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/popover-analysis.test.ts --reporter=verbose
